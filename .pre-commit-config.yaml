---
# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-config.json

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: Check this commit is not to the main/master branch
      - id: check-merge-conflict
        name: Check for merge conflicts before committing
      - id: check-case-conflict
        name: Check for case conflicts for case-sensitive filesystems
      - id: check-symlinks
        name: Check for broken symlinks in the repository
      - id: destroyed-symlinks
        name: Check for destroyed symlinks in the repository
      - id: check-added-large-files
        name: Check no large files have been added to the commit
      - id: trailing-whitespace
        name: Check all trailing whitespace is removed
      - id: end-of-file-fixer
        name: Check all files end in a new-line only

  - repo: https://github.com/gitguardian/ggshield
    rev: v1.53.0
    hooks:
      - id: ggshield
        name: Check for hard-coded secrets, keys, and credentials

  - repo: https://github.com/antonbabenko/pre-commit-terraform.git
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        name: Check Terraform configuration formatting

      - id: terraform_validate
        name: Validate the Terraform configuration
        files: ^terraform/
        args:
          - --tf-init-args=-upgrade
          - --tf-init-args=-get
          - --hook-config=--retry-once-with-cleanup=true

      - id: terraform_providers_lock
        name: Check Terraform Provider platforms configured
        args:
          - --args=-platform=linux_amd64
          - --args=-platform=linux_arm64
          - --args=-platform=darwin_arm64
          - --hook-config=--mode=regenerate-lockfile-if-some-platform-missed

      - id: terraform_tflint
        name: Lint the Terraform configuration
        files: ^terraform/
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      - id: terraform_docs
        name: Check the documentation for the Terraform configurations
        files: ^terraform/
        args:
          - --args=--config=.terraform-docs.yaml
          - --args=--lockfile=true

  # Formatting
  - repo: https://github.com/pre-commit/mirrors-prettier.git
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Lint selected files with Prettier
        args:
          - --config=.prettierrc.yaml
        additional_dependencies:
          - prettier@3.9.6
        types_or:
          - markdown
          - json
          - yaml

  # Linting
  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Check general Markdown correctness and formatting
        args:
          - --config
          - .markdownlint.yaml
          - --ignore-path
          - .markdownignore

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - name: Lint YAML files with yamllint
        id: yamllint
        args:
          - --config-file
          - .yamllint.yaml

  # Schema Validation
  - repo: https://github.com/python-jsonschema/check-jsonschema.git
    rev: 0.37.4
    hooks:
      - name: Check the Taskfiles for correctness
        id: check-taskfile
      - name: Check Dependabot configuration for correctness
        id: check-dependabot
      - name: Check GitHub Workflows for correctness
        id: check-github-workflows
      - name: Check GitHub Actions for correctness
        id: check-github-actions
      - name: Check Mergify configuration for correctness
        id: check-mergify

  # Static Analysis
  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.12
    hooks:
      - name: Lint all GitHub Workflows with actionlint
        id: actionlint-system
        args:
          - -config-file
          - .actionlint.yaml

  - repo: https://github.com/zizmorcore/zizmor-pre-commit.git
    rev: v1.28.0
    hooks:
      - name: Check GitHub Workflows for security issues with zizmor
        id: zizmor
        args:
          - --config
          - .github/zizmor.yaml
