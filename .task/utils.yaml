---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

tasks:
  utils:pre-check:exec:*:
    internal: true
    desc: Check for a specific executable in $PATH
    summary: >-
      Check for a specific executable to ensure it's available within $PATH before running any further tasks and
      commands.
    label: '{{ trimSuffix ":*" .TASK }}:{{ default "{...}" (index .MATCH 0) }}'
    prefix: '{{ trimSuffix ":*" .TASK }}:{{ default "{...}" (index .MATCH 0) }}'
    run: once
    silent: true
    cmds:
      - defer: "{{ if .EXIT_CODE }}echo -e '\e[1;31mFailed\e[0m'{{ end }}"
      - cmd: |-
          if ! command -v '{{ index .MATCH 0 }}' >/dev/null 2>&1; then
            echo -e '\e[1;31mFATAL: Cannot find `{{ index .MATCH 0 }}` in $PATH.\e[0m'
            exit 1
          fi

  utils:pre-commit:
    internal: true
    desc: Enable the pre-commit hook for this repository
    summary: >-
      Enable the pre-commit hook in this repository to ensure that all the required checks are run before committing
      staged changes back upstream
    run: once
    deps:
      - task: utils:pre-check:exec:pre-commit
    silent: true
    cmds:
      # Avoid outputting anything from this command
      - cmd: pre-commit install --allow-missing-config >/dev/null 2>&1
    generates:
      - "{{ .ROOT_DIR }}/.git/hooks/pre-commit"
    status:
      - test -f '{{ .ROOT_DIR }}/.git/hooks/pre-commit'
